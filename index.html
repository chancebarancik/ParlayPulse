<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parlay Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a18;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:1.25rem}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem}
.header h1{font-size:20px;font-weight:600}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.25rem}
.stat{background:#fff;border-radius:10px;padding:.85rem;text-align:center;border:0.5px solid #e0ddd6}
.stat-val{font-size:20px;font-weight:600}
.stat-lbl{font-size:11px;color:#888;margin-top:2px}
.green{color:#1D9E75}.red{color:#E24B4A}.amber{color:#BA7517}
.parlay-list{display:flex;flex-direction:column;gap:10px;margin-bottom:1.25rem}
.parlay-card{background:#fff;border:0.5px solid #e0ddd6;border-radius:12px;padding:1rem;cursor:pointer}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-meta{font-size:12px;color:#888;display:flex;align-items:center;gap:6px}
.card-book{font-size:12px;font-weight:500;color:#666;background:#f5f5f3;padding:2px 8px;border-radius:100px}
.card-legs{font-size:13px;color:#333;margin-bottom:8px;line-height:1.6}
.card-bottom{display:flex;justify-content:space-between;align-items:center}
.card-wager{font-size:12px;color:#888}
.card-payout{font-size:14px;font-weight:600}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot-win{background:#1D9E75}.dot-pending{background:#EF9F27}.dot-loss{background:#E24B4A}
.scanned-badge{font-size:11px;background:#EAF3DE;color:#3B6D11;padding:2px 7px;border-radius:100px;display:inline-flex;align-items:center;gap:3px}
.add-btn{width:100%;padding:.8rem;background:#fff;border:0.5px solid #ccc;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.add-btn:hover{background:#f0f0ee}

/* Modal */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-start;justify-content:center;padding:1rem;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:440px;margin:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;border-bottom:0.5px solid #e8e8e4;position:sticky;top:0;background:#fff;z-index:1;border-radius:14px 14px 0 0}
.modal-header h2{font-size:16px;font-weight:600}
.close-btn{width:28px;height:28px;border-radius:50%;border:none;background:#f0f0ee;cursor:pointer;font-size:15px;color:#666;display:flex;align-items:center;justify-content:center}
.modal-body{padding:1.25rem;display:flex;flex-direction:column;gap:14px}

/* Scan zone */
.scan-zone{border:1.5px dashed #ccc;border-radius:12px;padding:1.25rem;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;position:relative;overflow:hidden;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.scan-zone:hover{border-color:#185FA5;background:#f0f6ff}
.scan-zone.dragover{border-color:#185FA5;background:#e6f1fb}
.scan-zone.scanning{border-color:#185FA5;background:#f0f6ff}
.scan-zone.done{border-color:#1D9E75;background:#f0faf5;cursor:default}
.scan-icon{width:34px;height:34px;border-radius:8px;background:#f5f5f3;display:flex;align-items:center;justify-content:center;margin:0 auto}
.scan-title{font-size:13px;font-weight:500;color:#1a1a18}
.scan-sub{font-size:11px;color:#888}
.scan-bar{position:absolute;top:0;left:-100%;width:40%;height:2.5px;background:linear-gradient(90deg,transparent,#185FA5,transparent);animation:scanslide 1.1s ease-in-out infinite}
@keyframes scanslide{0%{left:-40%}100%{left:110%}}
.thumb-row{display:flex;align-items:center;gap:10px}
.thumb-icon{width:44px;height:54px;border-radius:6px;background:#f0faf5;border:0.5px solid #c0ddc0;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Form */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:#888;font-weight:500}
.field input,.field select{padding:8px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:13px;background:#fff;color:#1a1a18;width:100%;outline:none}
.field input:focus,.field select:focus{border-color:#185FA5}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.legs-section{display:flex;flex-direction:column;gap:8px}
.legs-label{font-size:12px;color:#888;font-weight:500}
.leg-row{display:flex;gap:6px;align-items:center}
.leg-row input{flex:1;padding:7px 10px;border:0.5px solid #ddd;border-radius:8px;font-size:12px;background:#fff;color:#1a1a18;outline:none}
.leg-row input:focus{border-color:#185FA5}
.leg-remove{width:22px;height:22px;border:none;background:none;color:#aaa;cursor:pointer;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.add-leg-btn{font-size:12px;color:#185FA5;background:none;border:none;cursor:pointer;text-align:left;padding:2px 0;font-weight:500}
.modal-footer{padding:1rem 1.25rem;border-top:0.5px solid #e8e8e4;display:flex;gap:8px;border-radius:0 0 14px 14px;background:#fff}
.btn-primary{flex:1;padding:.7rem;background:#185FA5;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.btn-primary:hover{background:#0C447C}
.btn-secondary{padding:.7rem 1rem;background:#f5f5f3;color:#1a1a18;border:0.5px solid #ddd;border-radius:8px;font-size:14px;cursor:pointer}
.hidden{display:none!important}
.separator{text-align:center;font-size:11px;color:#aaa;position:relative}
.separator::before,.separator::after{content:'';position:absolute;top:50%;width:42%;height:0.5px;background:#e8e8e4}
.separator::before{left:0}.separator::after{right:0}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>My Parlays</h1>
    <span style="font-size:12px;color:#888">Apr 13, 2026</span>
  </div>
  <div class="stat-row">
    <div class="stat"><div class="stat-val green" id="stat-net">+$214</div><div class="stat-lbl">Net</div></div>
    <div class="stat"><div class="stat-val" id="stat-rate">3/7</div><div class="stat-lbl">Hit rate</div></div>
    <div class="stat"><div class="stat-val" id="stat-wagered">$840</div><div class="stat-lbl">Wagered</div></div>
  </div>
  <div class="parlay-list" id="parlay-list"></div>
  <button class="add-btn" onclick="openModal()">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    Add Parlay
  </button>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2>Add Parlay</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <!-- Scan zone -->
      <div class="scan-zone" id="scan-zone" onclick="triggerUpload()" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
        <div id="scan-idle">
          <div class="scan-icon">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="5" height="5" rx="1" stroke="#185FA5" stroke-width="1.3"/><rect x="12" y="1" width="5" height="5" rx="1" stroke="#185FA5" stroke-width="1.3"/><rect x="1" y="12" width="5" height="5" rx="1" stroke="#185FA5" stroke-width="1.3"/><rect x="12" y="12" width="5" height="5" rx="1" stroke="#185FA5" stroke-width="1.3"/></svg>
          </div>
          <div class="scan-title" style="margin-top:6px">Scan your bet slip</div>
          <div class="scan-sub">Tap to upload or drag a screenshot · DraftKings, FanDuel, BetMGM, ESPN Bet</div>
        </div>
        <div id="scan-scanning" class="hidden">
          <div class="scan-bar"></div>
          <div class="scan-title" style="color:#185FA5;font-weight:600">Reading ticket…</div>
          <div class="scan-sub">Claude Vision is extracting your bets</div>
        </div>
        <div id="scan-done" class="hidden">
          <div class="thumb-row">
            <div class="thumb-icon">
              <svg width="20" height="24" viewBox="0 0 20 24" fill="none"><rect x="1" y="1" width="18" height="22" rx="2" stroke="#1D9E75" stroke-width="1.3"/><path d="M5 7h10M5 11h10M5 15h6" stroke="#1D9E75" stroke-width="1.3" stroke-linecap="round"/></svg>
            </div>
            <div style="flex:1;text-align:left">
              <span class="scanned-badge">
                <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5 3.5-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Scanned
              </span>
              <div id="scan-done-msg" style="font-size:11px;color:#888;margin-top:4px">Review fields below and edit anything</div>
            </div>
          </div>
        </div>
      </div>
      <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFile(event)">

      <div class="separator">or fill in manually</div>

      <div class="field-row">
        <div class="field"><label>Sportsbook</label>
          <select id="f-book"><option value="">Select…</option><option>DraftKings</option><option>FanDuel</option><option>BetMGM</option><option>ESPN Bet</option><option>Caesars</option><option>PointsBet</option><option>Other</option></select>
        </div>
        <div class="field"><label>Sport</label>
          <select id="f-sport"><option value="">Select…</option><option>NBA</option><option>NFL</option><option>MLB</option><option>NHL</option><option>Soccer</option><option>NCAAB</option><option>Mixed</option></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Wager ($)</label><input type="number" id="f-wager" placeholder="25.00" step="0.01"></div>
        <div class="field"><label>To win ($)</label><input type="number" id="f-payout" placeholder="150.00" step="0.01"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Odds</label><input type="text" id="f-odds" placeholder="+450"></div>
        <div class="field"><label>Status</label>
          <select id="f-status"><option value="pending">Pending</option><option value="win">Win ✓</option><option value="loss">Loss ✗</option></select>
        </div>
      </div>
      <div class="legs-section">
        <div class="legs-label">Legs</div>
        <div id="legs-container"></div>
        <button class="add-leg-btn" onclick="addLeg('')">+ Add leg</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveParlay()">Add Parlay</button>
    </div>
  </div>
</div>

<script>
const SAMPLE=[
  {id:1,book:"DraftKings",sport:"NBA",wager:50,payout:320,odds:"+540",status:"win",scanned:true,legs:["LeBron over 25.5 pts","Steph Curry over 5.5 ast","Lakers ML"]},
  {id:2,book:"FanDuel",sport:"MLB",wager:25,payout:0,odds:"+380",status:"loss",scanned:false,legs:["Yankees ML","Dodgers -1.5","Braves over 8.5"]},
  {id:3,book:"BetMGM",sport:"NBA",wager:40,payout:180,odds:"+350",status:"win",scanned:true,legs:["Giannis over 30.5 pts","Bucks -4.5","Tatum over 27.5 pts"]},
  {id:4,book:"DraftKings",sport:"NFL",wager:30,payout:195,odds:"+550",status:"pending",scanned:true,legs:["Chiefs ML","Mahomes over 295.5 yds","Kelce over 72.5 rec yds"]},
];
let parlays=[...SAMPLE];
let scanDone=false;

function renderStats(){
  let net=0,wins=0,wagered=0;
  parlays.forEach(p=>{
    wagered+=p.wager;
    if(p.status==='win'){net+=(p.payout-p.wager);wins++;}
    else if(p.status==='loss'){net-=p.wager;}
  });
  const netEl=document.getElementById('stat-net');
  netEl.textContent=(net>=0?'+':'')+'\$'+Math.abs(net).toFixed(0);
  netEl.className='stat-val '+(net>=0?'green':'red');
  document.getElementById('stat-rate').textContent=wins+'/'+parlays.length;
  document.getElementById('stat-wagered').textContent='\$'+wagered.toFixed(0);
}

function renderList(){
  const c=document.getElementById('parlay-list');
  if(!parlays.length){c.innerHTML='<div style="text-align:center;padding:2rem;color:#888;font-size:13px">No parlays yet. Add one!</div>';return;}
  c.innerHTML=parlays.map(p=>{
    const gain=p.status==='win'?'+\$'+(p.payout-p.wager).toFixed(0):p.status==='loss'?'-\$'+p.wager.toFixed(0):'\$'+p.payout.toFixed(0)+' to win';
    const payClass=p.status==='win'?'green':p.status==='loss'?'red':'amber';
    return`<div class="parlay-card">
      <div class="card-top">
        <div class="card-meta">
          <span class="status-dot dot-${p.status}"></span>
          ${p.sport}
          ${p.scanned?'<span class="scanned-badge"><svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5 3.5-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>scanned</span>':''}
        </div>
        <span class="card-book">${p.book}</span>
      </div>
      <div class="card-legs">${p.legs.map(l=>'· '+l).join('<br>')}</div>
      <div class="card-bottom">
        <span class="card-wager">\$${p.wager} · ${p.odds}</span>
        <span class="card-payout ${payClass}">${gain}</span>
      </div>
    </div>`;
  }).join('');
  renderStats();
}

function openModal(){
  resetModal();
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
function overlayClick(e){if(e.target===document.getElementById('overlay'))closeModal();}

function resetModal(){
  scanDone=false;
  const sz=document.getElementById('scan-zone');
  sz.className='scan-zone';
  document.getElementById('scan-idle').classList.remove('hidden');
  document.getElementById('scan-scanning').classList.add('hidden');
  document.getElementById('scan-done').classList.add('hidden');
  ['f-book','f-sport','f-wager','f-payout','f-odds'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-status').value='pending';
  document.getElementById('file-input').value='';
  document.getElementById('legs-container').innerHTML='';
  addLeg('');addLeg('');addLeg('');
}

function triggerUpload(){if(!scanDone)document.getElementById('file-input').click();}
function handleDragOver(e){e.preventDefault();document.getElementById('scan-zone').classList.add('dragover');}
function handleDragLeave(){document.getElementById('scan-zone').classList.remove('dragover');}
function handleDrop(e){
  e.preventDefault();
  const f=e.dataTransfer.files[0];
  if(f&&f.type.startsWith('image/'))processImage(f);
}
function handleFile(e){const f=e.target.files[0];if(f)processImage(f);}

function processImage(file){
  const reader=new FileReader();
  reader.onload=e=>{
    const b64=e.target.result.split(',')[1];
    const mime=file.type||'image/jpeg';
    startScan(b64,mime);
  };
  reader.readAsDataURL(file);
}

async function startScan(b64,mime){
  const sz=document.getElementById('scan-zone');
  sz.className='scan-zone scanning';
  document.getElementById('scan-idle').classList.add('hidden');
  document.getElementById('scan-scanning').classList.remove('hidden');
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mime,data:b64}},
          {type:'text',text:'Extract this sports bet slip into JSON only. No markdown, no explanation. Format: {"book":"","sport":"","wager":0,"payout":0,"odds":"","legs":["leg description..."]}. book = one of: DraftKings, FanDuel, BetMGM, ESPN Bet, Caesars, PointsBet, Other. sport = one of: NBA, NFL, MLB, NHL, Soccer, NCAAB, Mixed. wager and payout as numbers. odds as string like +450 or -110. legs as short readable strings. If any field is unknown use empty string or 0.'}
        ]}]
      })
    });
    const data=await resp.json();
    const text=data.content.map(i=>i.text||'').join('');
    const clean=text.replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(clean);
    fillForm(parsed);
    showScanDone(false);
  }catch(err){
    console.error(err);
    showScanDone(true);
  }
}

function fillForm(d){
  const books=['DraftKings','FanDuel','BetMGM','ESPN Bet','Caesars','PointsBet','Other'];
  const sports=['NBA','NFL','MLB','NHL','Soccer','NCAAB','Mixed'];
  if(d.book&&books.includes(d.book))document.getElementById('f-book').value=d.book;
  if(d.sport&&sports.includes(d.sport))document.getElementById('f-sport').value=d.sport;
  if(d.wager)document.getElementById('f-wager').value=d.wager;
  if(d.payout)document.getElementById('f-payout').value=d.payout;
  if(d.odds)document.getElementById('f-odds').value=d.odds;
  if(d.legs&&d.legs.length){
    document.getElementById('legs-container').innerHTML='';
    d.legs.forEach(l=>addLeg(l));
  }
}

function showScanDone(fallback){
  const sz=document.getElementById('scan-zone');
  sz.className='scan-zone done';
  document.getElementById('scan-scanning').classList.add('hidden');
  document.getElementById('scan-done').classList.remove('hidden');
  if(fallback)document.getElementById('scan-done-msg').textContent='Scan incomplete — fill in manually';
  scanDone=!fallback;
}

function addLeg(val){
  const c=document.getElementById('legs-container');
  const uid='leg_'+Date.now()+'_'+Math.floor(Math.random()*9999);
  const d=document.createElement('div');
  d.className='leg-row';d.id=uid;
  d.innerHTML=`<input type="text" placeholder="e.g. Lakers ML" value="${(val||'').replace(/"/g,'&quot;')}"><button class="leg-remove" onclick="document.getElementById('${uid}').remove()">×</button>`;
  c.appendChild(d);
}

function saveParlay(){
  const book=document.getElementById('f-book').value||'Other';
  const sport=document.getElementById('f-sport').value||'Mixed';
  const wager=parseFloat(document.getElementById('f-wager').value)||0;
  const payout=parseFloat(document.getElementById('f-payout').value)||0;
  const odds=document.getElementById('f-odds').value||'N/A';
  const status=document.getElementById('f-status').value;
  const legs=[...document.querySelectorAll('#legs-container input')].map(i=>i.value.trim()).filter(Boolean);
  if(!legs.length){alert('Add at least one leg.');return;}
  parlays.unshift({id:Date.now(),book,sport,wager,payout,odds,status,scanned:scanDone,legs});
  renderList();
  closeModal();
}

renderList();
</script>
</body>
</html>
