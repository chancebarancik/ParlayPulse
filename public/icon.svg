<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="gf">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square -->
  <rect width="128" height="128" rx="28" fill="#0a0a0f"/>

  <!-- P letterform -->
  <path d="M38 36 v56 h8 v-20 h18 a18 18 0 0 0 0 -36 h-26z M46 44 h16 a10 10 0 0 1 0 20 h-16z" fill="url(#g)"/>

  <!-- Pulse line through the P -->
  <polyline
    points="24,72 36,72 48,72 54,54 62,82 68,64 74,72 84,72 104,72"
    stroke="#10b981"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#gf)"
  />

  <!-- Pulse dot -->
  <circle cx="104" cy="72" r="3" fill="#34d399">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
